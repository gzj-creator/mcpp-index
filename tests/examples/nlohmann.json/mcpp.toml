# nlohmann/json test project: consumes the C++23 module `nlohmann.json` and
# asserts round-trip + ordered_json under `mcpp test`.
# Overrides the workspace-root redirect: root declares `compat`, this member
# needs `nlohmann`. A member-level [indices] REPLACES the inherited table rather
# than merging with it, which is what keeps this to ONE project index repo —
# two repos pointing at the same tree make every lookup ambiguous.
[indices]
nlohmann = { path = "../../.." }

[package]
name = "nlohmann-json-tests"
version = "0.1.0"

[dependencies.nlohmann]
json = "3.12.0"
