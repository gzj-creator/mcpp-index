# toml++ test project: consumes the C++23 module `tomlplusplus` and asserts
# parse + typed access + round-trip serialization under `mcpp test`.
# Overrides the workspace-root redirect: root declares `compat`, this member
# needs `marzer`. A member-level [indices] REPLACES the inherited table rather
# than merging with it, which is what keeps this to ONE project index repo —
# two repos pointing at the same tree make every lookup ambiguous.
[indices]
marzer = { path = "../../.." }

[package]
name = "tomlplusplus-tests"
version = "0.1.0"

[dependencies.marzer]
tomlplusplus = "3.4.0"
